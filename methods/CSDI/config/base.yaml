# Copied from https://github.com/Matas5/CSDI/blob/main/config/base.yaml
# ORIGINAL model and noise-schedule settings (PhysioNet 2012).
train:
  epochs: 200
  batch_size: 16
  lr: 1.0e-3
  itr_per_epoch: 1.0e+8

diffusion:
  layers: 4
  channels: 64
  nheads: 8
  diffusion_embedding_dim: 128
  beta_start: 0.0001
  beta_end: 0.5
  num_steps: 50
  schedule: "quad"
  is_linear: false

model:
  is_unconditional: false
  timeemb: 128
  featureemb: 16
  target_strategy: "random"
